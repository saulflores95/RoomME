services:
  postgres:
    image: postgres:16-alpine
    container_name: roomme-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: roomme
      POSTGRES_PASSWORD: roomme
      POSTGRES_DB: roomme
    ports:
      # Host 5433 avoids clashing with a local Postgres already on 5432
      - "5433:5432"
    volumes:
      - roomme_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roomme -d roomme"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  roomme_pg_data:
